# docker-compose.yml
# version 속성 제거 (obsolete 경고 해결)

services:
  # ============================================================
  # PostgreSQL + pgvector
  # ============================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: hidden_gem_db
    environment:
      POSTGRES_USER: juntae
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hidden_gem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juntae -d hidden_gem_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hidden_gem_network

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: hidden_gem_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hidden_gem_network

  # ============================================================
  # Django (Admin & Management)
  # ============================================================
  django:
    build:
      context: ./django_core
      dockerfile: Dockerfile
    container_name: hidden_gem_django
    environment:
      - DJANGO_DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hidden_gem_db
      - DB_USER=juntae
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./django_core:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - hidden_gem_network

  # ============================================================
  # FastAPI (Search API)
  # ============================================================
  fastapi:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    container_name: hidden_gem_fastapi
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hidden_gem_db
      - DB_USER=juntae
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENV=${SENTRY_ENV:-development}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # 채점 운영 플래그 — fastapi 컨테이너는 루트 .env 를 읽지 않으므로(config.env_file=".env" 는 /app 기준)
      # 여기서 넘겨야 한다. .env 만 고치고 restart 하면 무시된다는 걸 2026-09-05 R-3 전환에서 발견.
      # 값 바꾼 뒤엔 `docker compose up -d fastapi` (restart 는 env 를 다시 읽지 않는다).
      - SCORE_VERSION=${SCORE_VERSION:-v6}
      - GEM_SOURCE=${GEM_SOURCE:-legacy}
      - VIBE_SECONDARY_ENABLED=${VIBE_SECONDARY_ENABLED:-False}
      - PREF_EMBED_TIEBREAK=${PREF_EMBED_TIEBREAK:-True}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./fastapi_app:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - hidden_gem_network

  # ============================================================
  # Umami Analytics (셀프호스팅 무료 분석)
  # ============================================================
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: hidden_gem_umami
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami_db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-hidden-gem-umami-secret-change-me}
    ports:
      - "3001:3000"
    depends_on:
      umami_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hidden_gem_network

  # ============================================================
  # Umami DB (분석 전용 PostgreSQL, 게임 DB와 격리)
  # ============================================================
  umami_db:
    image: postgres:16-alpine
    container_name: hidden_gem_umami_db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hidden_gem_network

  # ============================================================
  # Batch worker (data pipeline: crawler / generator / processor)
  # 배치 워커 - 크롤러, 배치 생성, DB 적재 전용. 웹 컨테이너와 분리.
  # ============================================================
  batch:
    build:
      context: .
      dockerfile: Dockerfile.batch
    container_name: hidden_gem_batch
    # .env 전체를 전달 -> RAWG_API_KEY / STEAM_API_KEY / OPENAI_API_KEY / DATABASE_URL
    env_file:
      - .env
    environment:
      # .env의 DATABASE_URL이 db:5432를 가리키므로 같은 네트워크에서 그대로 동작
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./embeddings:/app/embeddings
      - ./data:/app/data
      - ./fastapi_app:/app/fastapi_app:ro
      - ./.env:/app/.env:ro
      - ./logs:/app/logs          # weekly_pipeline.log 가 컨테이너 재생성에도 남게 (2026-09-06)
    working_dir: /app
    # 평소엔 대기 상태. 실제 작업은 docker compose exec batch ... 로 실행
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hidden_gem_network

volumes:
  postgres_data:
  redis_data:
  umami_db_data:

networks:
  hidden_gem_network:
    driver: bridge