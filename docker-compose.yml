# docker-compose.yml
version: '3.8'

services:
  # ============================================================
  # PostgreSQL + pgvector
  # ============================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: hidden_gem_db
    environment:
      POSTGRES_USER: juntae
      POSTGRES_PASSWORD: "0312"
      POSTGRES_DB: hidden_gem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juntae -d hidden_gem_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hidden_gem_network

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: hidden_gem_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hidden_gem_network

  # ============================================================
  # Django (Admin & Management)
  # ============================================================
  django:
    build:
      context: ./django_core
      dockerfile: Dockerfile
    container_name: hidden_gem_django
    environment:
      - DJANGO_DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hidden_gem_db
      - DB_USER=juntae
      - DB_PASSWORD=0312
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./django_core:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - hidden_gem_network

  # ============================================================
  # FastAPI (Search API)
  # ============================================================
  fastapi:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    container_name: hidden_gem_fastapi
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hidden_gem_db
      - DB_USER=juntae
      - DB_PASSWORD=0312
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENV=${SENTRY_ENV:-development}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./fastapi_app:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - hidden_gem_network

volumes:
  postgres_data:
  redis_data:

networks:
  hidden_gem_network:
    driver: bridge